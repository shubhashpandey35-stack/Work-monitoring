<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · WFH Monitor</title>
  <link rel="stylesheet" href="../frontend/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand brand-center">
        <span class="logo">WM</span>
        <div><h1>Welcome back</h1><p class="muted small">Log in to your work dashboard</p></div>
      </div>

      <div id="alert" class="alert hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@company.com">
          <small class="field-error" id="emailError"></small>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password">
          <small class="field-error" id="passwordError"></small>
        </div>
        <button id="submitBtn" class="btn btn-primary btn-block" type="submit">
          <span class="btn-text">Log in</span><span class="spinner hidden"></span>
        </button>
      </form>

      <p class="auth-switch">New employee? <a href="register.html">Create an account</a></p>
      <p class="privacy-note">Transparency: after login, your online/inactive status is visible to your admin. Location is shared only if you turn it on.</p>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script type="module" src="js/login.js"></script>
    <script src="js/fx.js" defer></script>
</body>
</html>
